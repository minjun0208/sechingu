<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세친구곱창 구월점</title>
<meta name="description" content="세친구곱창 인천 구월점 포장 주문·네이버 플레이스·인스타그램">
<style>
  :root { --bg:#fff8f1; --card:#ffffff; --ink:#2b1d14; --sub:#7a6658; --main:#ff7e36; --main-ink:#fff; --line:#eadfd5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1612; --card:#2a211b; --ink:#f6ece4; --sub:#bfae9f; --line:#3d3129; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { max-width:440px; margin:0 auto; padding:36px 16px 40px; }
  h1 { font-size:26px; margin:0 0 4px; text-align:center; }
  .sub { text-align:center; color:var(--sub); margin:0 0 28px; font-size:15px; }
  a.btn { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
          background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:18px 18px; margin-bottom:12px; font-size:17px; font-weight:600; }
  a.btn .ico { font-size:26px; width:32px; text-align:center; }
  a.btn small { display:block; font-weight:400; color:var(--sub); font-size:13px; margin-top:2px; }
  a.btn.main { background:var(--main); color:var(--main-ink); border-color:var(--main); padding:24px 18px; font-size:20px; }
  a.btn.main small { color:#ffe9dc; font-size:14px; }
  .note { margin-top:24px; font-size:13px; color:var(--sub); text-align:center; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>세친구곱창 구월점</h1>
  <p class="sub">인천 남동구 구월동 · 배달·포장 전문</p>

  <a class="btn main" href="https://www.daangn.com/kr/link/pickup/menu/20002269">
    <span class="ico">🛍️</span>
    <span>포장 주문하기<small>당근에서 주문 · 포장 할인</small></span>
  </a>

  <a class="btn" href="https://m.place.naver.com/restaurant/1046581273/home">
    <span class="ico">📍</span>
    <span>네이버 플레이스<small>위치 · 메뉴 · 리뷰</small></span>
  </a>

  <a class="btn" href="https://www.instagram.com/incheon_sechingu_gobchang/">
    <span class="ico">📸</span>
    <span>인스타그램<small>새 메뉴 · 이벤트 소식</small></span>
  </a>

  <p class="note">쿠폰 5장 모으면 <b>철판볶음밥</b> 제공<br>쿠폰 10장 모으면 <b>야채곱창 1인 단품</b> 제공</p>
</main>
</body>
</html>
